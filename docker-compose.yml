services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  backend:
    build: ./backend
    ports: ["5000:5000"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ledgerly
      SECRET_KEY: change-this-long-random-secret
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    depends_on: [mongo]
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  mongo-data:
