services:
  - type: web
    name: ledgerly-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - { key: PYTHON_VERSION, value: 3.12.3 }
      - { key: SECRET_KEY, generateValue: true }
      - { key: CRON_SECRET, generateValue: true }
      - { key: MONGO_URI, sync: false }
      - { key: MONGO_DB, value: ledgerly }
      - { key: CORS_ORIGINS, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: MAIL_FROM, sync: false }
  # Optional: emails last month's PDF on the 1st of every month (needs SMTP vars on the API service).
  # Create it in the dashboard if you prefer: New > Cron Job, schedule "0 8 1 * *".
  - type: cron
    name: ledgerly-monthly-report
    runtime: python
    rootDir: backend
    schedule: "0 8 1 * *"
    buildCommand: echo "no build"
    startCommand: curl -fsS -X POST -H "X-Cron-Secret: $CRON_SECRET" "$API_URL/api/cron/monthly-report"
    envVars:
      - { key: API_URL, sync: false }
      - { key: CRON_SECRET, sync: false }
