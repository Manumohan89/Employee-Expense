<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledgerly - Audit log</title>
<link rel="icon" href="img/logo.svg"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f6f54">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body><div id="nav"></div><main><div id="msgs"></div>
<div class="head"><h2>Audit log</h2></div><div class="scroll"><table class="tbl"><thead><tr><th>Time (UTC)</th><th>User</th><th>Action</th><th>Target</th><th>Detail</th></tr></thead><tbody id="rows"></tbody></table></div>
</main><footer>Ledgerly &middot; Static frontend &middot; Flask + MongoDB API</footer><script src="js/config.js"></script><script src="js/app.js"></script>
<script>(async()=>{if(!guard(["admin"]))return;try{const d=await api("/api/audit");rows.innerHTML=d.rows.map(a=>`<tr><td>${a.ts}</td><td>${esc(a.user)} (${esc(a.role)})</td><td>${esc(a.action)}</td><td>${esc(a.target)}</td><td>${esc(a.detail)}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">No activity yet.</td></tr>`}catch(x){msg(x.message,"err")}})();</script>
</body></html>
