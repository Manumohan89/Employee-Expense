<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledgerly - Expenses</title>
<link rel="icon" href="img/logo.svg"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f6f54">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body><div id="nav"></div><main><div id="msgs"></div>
<div class="head"><h2>Expenses</h2><a class="btn" href="form.html">Add expense</a></div><form class="up" id="flt"><input name="q" placeholder="Search employee or description"><select name="category"><option value="">All categories</option></select><select name="month"><option value="">All months</option></select><select name="status"><option value="">All statuses</option><option>Approved</option><option>Pending</option><option>Rejected</option></select><button class="btn ghost">Filter</button></form><div class="scroll"><table class="tbl"><thead><tr><th>Date</th><th>Employee</th><th>Category</th><th>Amount</th><th>Description</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button class="btn sm ghost" id="pv">Previous</button><span id="pi"></span><button class="btn sm ghost" id="nx">Next</button></div><button class="link danger hide" id="clr">Delete all data (admin)</button>
</main><footer>Ledgerly &middot; Static frontend &middot; Flask + MongoDB API</footer><script src="js/config.js"></script><script src="js/app.js"></script>
<script>let page=1,init=false;const sp=new URLSearchParams(location.search);if(sp.get("status"))flt.status.value=sp.get("status");
async function load(){try{const p=new URLSearchParams(new FormData(flt));p.set("page",page);const d=await api("/api/expenses?"+p);
if(!init){init=true;d.categories.forEach(c=>flt.category.add(new Option(c,c)));d.months.forEach(c=>flt.month.add(new Option(c,c)));clr.classList.toggle("hide",role()!=="admin")}
rows.innerHTML=d.rows.map(r=>{const can=isPriv()||r.approval_status==="Pending";return `<tr><td>${r.date}</td><td>${esc(r.employee_id)}</td><td>${esc(r.category)}</td><td>${money(r.amount)}</td><td>${esc(r.description)} ${r.flags?`<span class="badge red">${esc(r.flags)}</span>`:""}${r.review_comment?`<br><small>Manager note: ${esc(r.review_comment)}</small>`:""}</td><td><span class="badge ${r.approval_status.toLowerCase()}">${r.approval_status}</span></td><td class="act">${r.has_receipt?`<button class="link" data-rc="${r.id}">Receipt</button>`:""}${isPriv()&&r.approval_status==="Pending"?`<button class="link" data-rv="${r.id}:Approved">Approve</button><button class="link" data-rv="${r.id}:Rejected">Reject</button>`:""}${can?`<a href="form.html?id=${r.id}">Edit</a><button class="link" data-id="${r.id}">Delete</button>`:""}</td></tr>`}).join("")||`<tr><td colspan="7" class="empty">No expenses match.</td></tr>`;
pi.textContent=`Page ${d.page} of ${d.pages} (${d.total} expenses)`;pv.disabled=d.page<=1;nx.disabled=d.page>=d.pages}catch(x){msg(x.message,"err")}}
flt.onsubmit=e=>{e.preventDefault();page=1;load()};pv.onclick=()=>{page--;load()};nx.onclick=()=>{page++;load()};
rows.onclick=async e=>{const b=e.target.dataset;try{if(b.rc){window.open(URL.createObjectURL(await blobOf("/api/expenses/"+b.rc+"/receipt")))}
else if(b.rv){const[id,dec]=b.rv.split(":");const c=prompt((dec==="Approved"?"Approve":"Reject")+" - add a comment (optional)");if(c===null)return;await api("/api/expenses/"+id+"/review",{method:"POST",json:{decision:dec,comment:c}});msg("Expense "+dec.toLowerCase()+".");load()}
else if(b.id&&confirm("Delete this expense?")){await api("/api/expenses/"+b.id,{method:"DELETE"});msg("Expense deleted.");load()}}catch(x){msg(x.message,"err")}};
clr.onclick=async()=>{if(confirm("Delete ALL expenses, receipts and logs?")){try{await api("/api/expenses",{method:"DELETE"});msg("All data cleared.");load()}catch(x){msg(x.message,"err")}}};
if(guard())load();</script>
</body></html>
