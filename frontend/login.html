<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledgerly - Sign in</title>
<link rel="icon" href="img/logo.svg"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f6f54">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body><div id="nav"></div><main><div id="msgs"></div>
<form class="card" id="f"><img src="img/logo.svg" alt="" width="52"><h2>Welcome back</h2><label>Email<input type="email" name="email" required autofocus></label><label>Password<input type="password" name="password" required></label><button class="btn wide">Sign in</button><p class="sub"><a href="forgot.html">Forgot password?</a> &middot; <a href="register.html">Create an account</a></p></form>
</main><footer>Ledgerly &middot; Static frontend &middot; Flask + MongoDB API</footer><script src="js/config.js"></script><script src="js/app.js"></script>
<script>f.onsubmit=async e=>{e.preventDefault();try{const d=await api("/api/login",{method:"POST",noRedirect:true,json:Object.fromEntries(new FormData(f))});for(const k of["token","name","role","emp_id"])localStorage.setItem(k,d[k]);location.href="dashboard.html"}catch(x){msg(x.message,"err")}}</script>
</body></html>
