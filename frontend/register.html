<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledgerly - Create account</title>
<link rel="icon" href="img/logo.svg"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f6f54">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body><div id="nav"></div><main><div id="msgs"></div>
<form class="card" id="f"><img src="img/logo.svg" alt="" width="52"><h2>Create your account</h2><label>Full name<input name="name" autocomplete="name" required autofocus></label><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password (6+ characters)<input id="password" type="password" name="password" minlength="6" autocomplete="new-password" required></label><label>Confirm password<input id="confirm-password" type="password" name="confirm_password" minlength="6" autocomplete="new-password" required></label><button class="btn wide">Create account</button><p class="sub">The first account becomes the admin. Later accounts start as employees; an admin can assign manager access. Already registered? <a href="login.html">Sign in</a></p></form>
</main><footer>Ledgerly &middot; Static frontend &middot; Flask + MongoDB API</footer><script src="js/config.js"></script><script src="js/app.js"></script>
<script>f.onsubmit=async e=>{e.preventDefault();if(f.password.value!==f.confirm_password.value){msg("Passwords do not match.","err");f.confirm_password.focus();return}try{await api("/api/register",{method:"POST",noRedirect:true,json:Object.fromEntries(new FormData(f))});location.href="login.html"}catch(x){msg(x.message,"err")}}</script>
</body></html>
